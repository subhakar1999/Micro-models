[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-models"
version = "0.1.0"
description = "Isolated, bounded inference services and model specialization tools"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1", "psutil>=6,<8"]

[project.optional-dependencies]
lite = []
text = ["llama-cpp-python>=0.3.8,<1"]
asr = ["faster-whisper>=1.1,<2"]
tts = ["kokoro>=0.9.4,<1", "soundfile>=0.13,<1"]
ocr = ["pypdfium2>=4.30,<6", "pytesseract>=0.3.13,<1", "Pillow>=11,<13"]
train = ["torch>=2.6,<3", "transformers>=4.51,<5", "peft>=0.15,<1", "accelerate>=1.6,<2", "datasets>=3.5,<5"]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["micro_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
